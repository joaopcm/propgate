networks:
  dns:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.53.0/24

x-darwin-common: &darwin-common
  network_mode: ""
  healthcheck:
    test: ["CMD", "dig", "+short", "+time=2", "+tries=1", "@127.0.0.1", "test.", "SOA"]
    interval: 3s
    timeout: 4s
    retries: 10
    start_period: 2s

services:
  dns-root:
    <<: *darwin-common
    environment:
      ROLE: root
      BIND_ADDRESS: 0.0.0.0
    networks:
      dns:
        ipv4_address: 172.28.53.2
    ports:
      - "127.0.0.1:5302:53/udp"
      - "127.0.0.1:5302:53/tcp"

  dns-auth:
    <<: *darwin-common
    environment:
      ROLE: auth
      BIND_ADDRESS: 0.0.0.0
    networks:
      dns:
        ipv4_address: 172.28.53.3
    ports:
      - "127.0.0.1:5303:53/udp"
      - "127.0.0.1:5303:53/tcp"
    healthcheck:
      test: ["CMD", "dig", "+short", "+time=2", "+tries=1", "@127.0.0.1", "_rev.canary.test.", "TXT"]
      interval: 3s
      timeout: 4s
      retries: 10
      start_period: 2s

  dns-decoy:
    <<: *darwin-common
    environment:
      ROLE: decoy
      BIND_ADDRESS: 0.0.0.0
    networks:
      dns:
        ipv4_address: 172.28.53.4
    ports:
      - "127.0.0.1:5304:53/udp"
      - "127.0.0.1:5304:53/tcp"
    healthcheck:
      test: ["CMD", "dig", "+short", "+time=2", "+tries=1", "@127.0.0.1", "decoy.test.", "SOA"]
      interval: 3s
      timeout: 4s
      retries: 10
      start_period: 2s

  dns-divergent:
    <<: *darwin-common
    environment:
      ROLE: divergent
      BIND_ADDRESS: 0.0.0.0
    networks:
      dns:
        ipv4_address: 172.28.53.8
    ports:
      - "127.0.0.1:5308:53/udp"
      - "127.0.0.1:5308:53/tcp"
    healthcheck:
      test: ["CMD", "dig", "+short", "+time=2", "+tries=1", "@127.0.0.1", "divergent.test.", "SOA"]
      interval: 3s
      timeout: 4s
      retries: 10
      start_period: 2s

  dns-resolver:
    <<: *darwin-common
    environment:
      ROLE: resolver
      BIND_ADDRESS: 0.0.0.0
      ROOT_ADDRESS: 172.28.53.2
    networks:
      dns:
        ipv4_address: 172.28.53.6
    ports:
      - "127.0.0.1:5306:53/udp"
      - "127.0.0.1:5306:53/tcp"
    healthcheck:
      test: ["CMD", "sh", "-c", "dig +time=2 +tries=1 @127.0.0.1 secure.test. SOA +dnssec | grep -q 'flags:.* ad'"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 3s

  dns-permissive:
    <<: *darwin-common
    environment:
      ROLE: permissive
      BIND_ADDRESS: 0.0.0.0
      ROOT_ADDRESS: 172.28.53.2
    networks:
      dns:
        ipv4_address: 172.28.53.7
    ports:
      - "127.0.0.1:5307:53/udp"
      - "127.0.0.1:5307:53/tcp"
    healthcheck:
      test: ["CMD", "sh", "-c", "test -n \"$$(dig +short +time=2 +tries=1 @127.0.0.1 bogus-zone.test. TXT)\""]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 3s
