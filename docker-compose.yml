x-dns-common: &dns-common
  build:
    context: .
    dockerfile: docker/dns/Dockerfile
  image: propgate/dns-fixtures:local
  network_mode: host
  restart: unless-stopped
  volumes:
    - ./packages/dns-fixtures/zones:/fixtures/zones:ro
    - ./packages/dns-fixtures/REVISION:/fixtures/REVISION:ro

services:
  dns-root:
    <<: *dns-common
    container_name: propgate-dns-root
    environment:
      ROLE: root
      BIND_ADDRESS: 127.0.0.2
    healthcheck:
      test: ["CMD", "dig", "+short", "+time=2", "+tries=1", "@127.0.0.2", "test.", "SOA"]
      interval: 3s
      timeout: 4s
      retries: 10
      start_period: 2s

  dns-auth:
    <<: *dns-common
    container_name: propgate-dns-auth
    environment:
      ROLE: auth
      BIND_ADDRESS: 127.0.0.3
    healthcheck:
      test: ["CMD", "dig", "+short", "+time=2", "+tries=1", "@127.0.0.3", "_rev.canary.test.", "TXT"]
      interval: 3s
      timeout: 4s
      retries: 10
      start_period: 2s

  dns-decoy:
    <<: *dns-common
    container_name: propgate-dns-decoy
    environment:
      ROLE: decoy
      BIND_ADDRESS: 127.0.0.4
    healthcheck:
      test: ["CMD", "dig", "+short", "+time=2", "+tries=1", "@127.0.0.4", "decoy.test.", "SOA"]
      interval: 3s
      timeout: 4s
      retries: 10
      start_period: 2s

  dns-divergent:
    <<: *dns-common
    container_name: propgate-dns-divergent
    environment:
      ROLE: divergent
      BIND_ADDRESS: 127.0.0.8
    healthcheck:
      test: ["CMD", "dig", "+short", "+time=2", "+tries=1", "@127.0.0.8", "divergent.test.", "SOA"]
      interval: 3s
      timeout: 4s
      retries: 10
      start_period: 2s

  dns-resolver:
    <<: *dns-common
    container_name: propgate-dns-resolver
    depends_on:
      dns-root:
        condition: service_healthy
      dns-auth:
        condition: service_healthy
    environment:
      ROLE: resolver
      BIND_ADDRESS: 127.0.0.6
      ROOT_ADDRESS: 127.0.0.2
    healthcheck:
      test: ["CMD", "sh", "-c", "dig +time=2 +tries=1 @127.0.0.6 secure.test. SOA +dnssec | grep -q 'flags:.* ad'"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 3s

  dns-permissive:
    <<: *dns-common
    container_name: propgate-dns-permissive
    depends_on:
      dns-root:
        condition: service_healthy
      dns-auth:
        condition: service_healthy
    environment:
      ROLE: permissive
      BIND_ADDRESS: 127.0.0.7
      ROOT_ADDRESS: 127.0.0.2
    healthcheck:
      test: ["CMD", "sh", "-c", "test -n \"$$(dig +short +time=2 +tries=1 @127.0.0.7 bogus-zone.test. TXT)\""]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 3s

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5442:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: propgate
      POSTGRES_PASSWORD: propgate
      POSTGRES_DB: propgate_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propgate -d propgate_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6389:6379"
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
