name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  fixtures:
    name: DNS fixtures
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start DNS fixtures, Postgres and Redis
        run: docker compose up -d --build --wait

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run fixture-backed tests
        env:
          PROPGATE_FIXTURES: "1"
          PROPGATE_REDIS: "1"
        run: pnpm test

      - name: Assert the fixture-backed specs actually ran
        env:
          PROPGATE_FIXTURES: "1"
          PROPGATE_DATABASE: "1"
          PROPGATE_REDIS: "1"
          DATABASE_URL: postgres://propgate:propgate@127.0.0.1:5442/propgate_test
        run: |
          pnpm --filter @propgate/dns exec vitest run --project dns-fixtures
          pnpm --filter @propgate/api exec vitest run --project api-fixtures
          pnpm --filter @propgate/cli exec vitest run --project cli-fixtures
          pnpm --filter @propgate/db exec vitest run --project db-postgres
          pnpm --filter @propgate/api exec vitest run --project api-postgres
          pnpm --filter @propgate/api exec vitest run --project api-integration
          pnpm --filter @propgate/api exec vitest run --project api-e2e
          pnpm --filter @propgate/jobs exec vitest run --project jobs-redis

      - name: DNS fixture logs
        if: ${{ failure() }}
        run: |
          docker compose ps
          docker compose logs --no-color \
            dns-root dns-auth dns-decoy dns-resolver dns-permissive dns-divergent \
            postgres redis
