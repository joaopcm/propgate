name: Build

on:
  pull_request:
    branches: [main]

# Builds only compile and bundle — they need placeholder values to satisfy
# build-time env validation, not real secrets. apps/web and apps/docs both
# side-effect import ./src/env, so a missing var fails the build rather than the
# first request; that is the behaviour we want, and this is how CI satisfies it.
env:
  NEXT_PUBLIC_API_URL: "http://localhost:3001"
  API_URL: "http://localhost:3001"
  DATABASE_URL: "postgres://placeholder:placeholder@127.0.0.1:5432/placeholder"
  PORT: "3001"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            filter: "@propgate/api"
          - name: Web
            filter: "@propgate/web"
          - name: Docs
            filter: "@propgate/docs"
          - name: Learn
            filter: "@propgate/learn"
          - name: DNS
            filter: "@propgate/dns"
          - name: CLI
            filter: "@propgate/cli"
          - name: SDK
            filter: "@propgate/sdk"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ${{ matrix.filter }} build

      # The Worker script, validated the way Cloudflare validates it.
      #
      # `worker-graph.spec.ts` catches the import that caused this in `pnpm
      # test`, and does it faster and with a better message. This is the
      # authoritative version: it bundles for real, so a dynamic import or a
      # transitive path the static walk cannot see still fails here.
      #
      # It is worth both, because the failure it guards is silent until deploy.
      # `docs.propgate.dev` published nothing for three releases while every
      # build, lint and test stayed green — the assets uploaded fine and only
      # the script was rejected, with `No such module "node:fs"`.
      #
      # No credentials needed: --dry-run bundles and exits without calling the
      # API. It needs `out/` from the build above, so it runs after it.
      - name: Validate the Worker bundle
        if: matrix.name == 'Docs'
        run: pnpm --filter ${{ matrix.filter }} verify:worker
