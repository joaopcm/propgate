name: Deploy API

# Build the image, push it to GHCR, then `pull && up -d` over SSH. Deliberately
# boring: one long-running process on one box, which is the shape the sweeper
# needs and the worst possible fit for per-invocation billing.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/dns/**"
      - "packages/db/**"
      - "docker/unbound/**"
      - "docker/caddy/**"
      - "docker-compose.prod.yml"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  # Never two deploys onto one box at once: the second `up -d` would race the
  # first one's migration step.
  group: deploy-api
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: apps/api/Dockerfile
          - image: unbound
            context: docker/unbound
            dockerfile: docker/unbound/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Tagged by commit as well as `latest`, so a rollback is
          # `TAG=<sha> docker compose up -d` rather than an archaeology exercise.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to the VPS
    needs: build
    runs-on: ubuntu-latest
    # A GitHub environment, so the deploy secrets are not readable by every
    # workflow in the repository.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Ship it
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The checkout on the box supplies docker-compose.prod.yml and the
          # Caddyfile; the images come from the registry. Nothing is built here.
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch --quiet origin main
            git reset --quiet --hard ${{ github.sha }}
            export TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --wait
            docker image prune -f

      - name: Prove it answers
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl -fsS "https://${{ vars.API_DOMAIN || 'api.propgate.dev' }}/health" | grep -q '"ok"'; then
              echo "healthy"
              exit 0
            fi
            echo "attempt $attempt: not healthy yet"
            sleep 6
          done
          echo "the API never reported healthy after the deploy"
          exit 1
