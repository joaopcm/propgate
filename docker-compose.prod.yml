services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: propgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: propgate
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_BIND_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propgate -d propgate"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  unbound:
    build:
      context: docker/unbound
    image: ghcr.io/${GITHUB_REPOSITORY:-joaopcm/propgate}/unbound:${TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "dig", "+short", "+time=2", "+tries=1", "@127.0.0.1", "a.root-servers.net", "A"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-joaopcm/propgate}/api:${TAG:-latest}
    command: ["node", "dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://propgate:${POSTGRES_PASSWORD:?}@postgres:5432/propgate
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-joaopcm/propgate}/api:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://propgate:${POSTGRES_PASSWORD:?}@postgres:5432/propgate
      NODE_ENV: production
      PORT: 3001
      REDIS_URL: redis://redis:6379
      RESOLVER_ADDRESS: unbound
      RESOLVER_PORT: 53
      RESOLVER_ADDRESSES: ${RESOLVER_ADDRESSES:-}
      DEGRADED_AFTER_FAILURES: ${DEGRADED_AFTER_FAILURES:-}
      FAILED_AFTER_FAILURES: ${FAILED_AFTER_FAILURES:-}
      WEBHOOK_ATTEMPTS: ${WEBHOOK_ATTEMPTS:-}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_SEGMENT_ID: ${RESEND_SEGMENT_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      unbound:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-joaopcm/propgate}/api:${TAG:-latest}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://propgate:${POSTGRES_PASSWORD:?}@postgres:5432/propgate
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      RESOLVER_ADDRESS: unbound
      RESOLVER_PORT: 53
      RESOLVER_ADDRESSES: ${RESOLVER_ADDRESSES:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      CHECK_CONCURRENCY: ${CHECK_CONCURRENCY:-}
      DEGRADED_AFTER_FAILURES: ${DEGRADED_AFTER_FAILURES:-}
      FAILED_AFTER_FAILURES: ${FAILED_AFTER_FAILURES:-}
      WEBHOOK_ATTEMPTS: ${WEBHOOK_ATTEMPTS:-}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-}
      SWEEP_BATCH_SIZE: ${SWEEP_BATCH_SIZE:-}
      SWEEP_LEASE_SECONDS: ${SWEEP_LEASE_SECONDS:-}
      SWEEP_TICK_SECONDS: ${SWEEP_TICK_SECONDS:-}
      WORKBENCH_PORT: 3002
      WORKBENCH_PASS: ${WORKBENCH_PASS:-}
      WORKBENCH_USER: ${WORKBENCH_USER:-}
    ports:
      - "${WORKBENCH_BIND_ADDRESS:-127.0.0.1}:${WORKBENCH_BIND_PORT:-3002}:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      unbound:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
