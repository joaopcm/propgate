# The production recursive resolver.
#
# Deliberately not the fixture tier's config, and worth reading side by side
# with it: almost every setting is the opposite, because the two exist for
# opposite reasons. The fixture resolver serves a fake root with validation
# rigged so pathological zones stay observable. This one resolves the real
# internet and must be boring, correct, and closed.
#
# Running our own rather than pointing at 1.1.1.1 is a product decision. An
# answer from someone else's cache is an answer we cannot explain, and "what did
# you actually see" is the question the whole diagnosis taxonomy exists to
# answer. It also leaves room for the per-vantage-point resolvers Phase 3 wants.

server:
  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes

  # THE most important lines in this file. An open recursive resolver on a
  # public IP is a DNS amplification weapon: an attacker spoofs a victim's
  # source address, sends a small query, and we mail the victim a large answer.
  # Only the compose network may ask. The container publishes no port, so this
  # is the second lock on a door that is already shut.
  access-control: 0.0.0.0/0 refuse
  access-control: 127.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 10.0.0.0/8 allow

  # The real root trust anchor, maintained in place by unbound-anchor. The
  # fixture tier pins a fake root's KSK instead, which is exactly the setting
  # that must not be copied here.
  auto-trust-anchor-file: /var/lib/unbound/root.key
  harden-dnssec-stripped: yes
  harden-glue: yes
  harden-below-nxdomain: yes
  val-clean-additional: yes

  # Privacy, and normal production behaviour. The fixture tier turns this off so
  # a spec can predict the exact queries a resolution makes.
  qname-minimisation: yes

  # Rebinding protection is on here and must stay off in the fixture tier, where
  # the entire namespace lives in 127.0.0.0/8. On the real internet a private
  # address in a public answer is either a mistake or an attack.
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: 127.0.0.0/8

  # Sized for a small VPS. The sweeper re-reads the same zones on a cycle, so
  # the cache earns its keep; prefetch renews popular entries before they lapse
  # rather than making a customer's check wait for a cold miss.
  msg-cache-size: 64m
  rrset-cache-size: 128m
  prefetch: yes

  # Never serve an answer past its TTL. A resolver that lies about freshness
  # would make "the record changed" arrive late, and lateness is the failure
  # this product is supposed to catch.
  cache-max-ttl: 86400
  cache-min-ttl: 0
  serve-expired: no

  # EDNS buffer that survives the real internet's broken middleboxes. 1232 is
  # the DNS Flag Day 2020 recommendation: under the common 1280-byte IPv6 MTU,
  # so fragmentation never enters the picture.
  edns-buffer-size: 1232

  hide-identity: yes
  hide-version: yes
  num-threads: 2
  so-reuseport: yes

  verbosity: 1
  log-queries: no
