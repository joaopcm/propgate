# dns-resolver — the validating tier.
#
# Written from scratch on purpose. Alpine's shipped unbound.conf sets
# auto-trust-anchor-file and expects unbound-anchor to fetch the *real* root KSK;
# against a fake root that makes every single answer bogus, and it is a
# genuinely baffling failure to debug.
server:
  interface: @BIND_ADDRESS@
  port: @DNS_PORT@
  do-ip6: no
  access-control: 127.0.0.0/8 allow
  username: ""
  directory: "/etc/unbound"
  logfile: ""
  use-syslog: no
  chroot: ""
  pidfile: "/tmp/unbound-resolver.pid"
  verbosity: 1

  # MANDATORY. Unbound refuses to query 127.0.0.0/8 by default and the entire
  # fixture namespace lives there. Omitting this is the single most likely
  # first-day failure of this harness.
  do-not-query-localhost: no

  # Deliberately NOT setting `private-address`. Several distro defaults include
  # 127.0.0.0/8, and DNS-rebinding protection would then strip our glue A
  # records, producing SERVFAILs with no obvious cause.

  root-hints: "/etc/unbound/root.hints"
  module-config: "validator iterator"
  trust-anchor-file: "/fixtures/zones/signed/root.anchor"
  val-log-level: 2

  # Determinism. Each of these would otherwise make an assertion depend on
  # resolver cleverness rather than on the fixture.
  qname-minimisation: no      # changes what the lame-delegation fixtures observe
  aggressive-nsec: no         # synthesises NXDOMAINs, breaking negative-cache tests
  prefetch: no
  prefetch-key: no
  cache-min-ttl: 0
  cache-max-negative-ttl: 3600
  use-caps-for-id: no
  minimal-responses: no
  rrset-roundrobin: no
  hide-version: yes

  # Deliberately permissive about *serving* broken data upward, so a bogus
  # answer surfaces as SERVFAIL from validation rather than being masked.
  harden-dnssec-stripped: yes
  val-permissive-mode: no

remote-control:
  control-enable: yes
  control-interface: @BIND_ADDRESS@
  control-port: 8953
  # Plain TCP line protocol, so flushing a zone from a test needs no
  # unbound-control-setup TLS dance. Safe only because this container is
  # test-only and bound to loopback; never carry this into production.
  control-use-cert: no
