# dns-permissive — iterator only, no validation.
#
# This container exists for one reason: "SERVFAIL to a validating resolver,
# resolves fine to a non-validating one" is a property of the *resolver*, not of
# the authoritative server. An authoritative server serves bogus signatures
# perfectly happily. Without this differential the entire DNSSEC family of
# diagnosis codes would be untestable.
server:
  interface: @BIND_ADDRESS@
  port: @DNS_PORT@
  do-ip6: no
  access-control: 127.0.0.0/8 allow
  username: ""
  directory: "/etc/unbound"
  logfile: ""
  use-syslog: no
  chroot: ""
  pidfile: "/tmp/unbound-permissive.pid"
  verbosity: 1

  do-not-query-localhost: no

  # See validating.conf: RFC 6761 reserves .test, so Unbound's default
  # `local-zone: "test." static` would answer NXDOMAIN authoritatively for the
  # whole fixture namespace without sending a single query.
  local-zone: "test." nodefault

  root-hints: "/etc/unbound/root.hints"
  # No validator module and no trust anchor: bogus zones resolve normally here.
  module-config: "iterator"

  qname-minimisation: no
  aggressive-nsec: no
  prefetch: no
  cache-min-ttl: 0
  use-caps-for-id: no
  minimal-responses: no
  rrset-roundrobin: no
  hide-version: yes

remote-control:
  control-enable: yes
  control-interface: @BIND_ADDRESS@
  control-port: 8953
  control-use-cert: no
